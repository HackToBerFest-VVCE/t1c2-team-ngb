<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">ThreatLens AI · Team Nova cybersecurity platform</title>
  <desc id="desc">Halloween-themed Team Nova ThreatLens AI architecture. Production React and Flask applications read a bounded NVD-origin vulnerability table in Snowflake. The diagram also shows Snowpark and Streamlit workflows, optional dataset templates, held-out evaluation, and audit and AI account limitations.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171522"/><stop offset="1" stop-color="#0d0c13"/></linearGradient>
    <linearGradient id="orange" x2="1" y2="1"><stop stop-color="#ff9a3d"/><stop offset="1" stop-color="#e85b21"/></linearGradient>
    <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#9b7aff"/><stop offset="1" stop-color="#6647c8"/></linearGradient>
    <pattern id="stars" width="84" height="76" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r="1" fill="#fff" opacity=".25"/><circle cx="63" cy="54" r="1.4" fill="#f79a43" opacity=".38"/><path d="M40 10v6m-3-3h6" stroke="#fff" stroke-width="1" opacity=".22"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f5a04c"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#f8f2e9}.muted{fill:#b9b2c2}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:16px}.head{font-size:21px;font-weight:750}.section{font-size:23px;font-weight:800}.tag{font-size:12px;font-weight:800;letter-spacing:1px}.card{fill:#211e2c;stroke:#454052;stroke-width:1.5}.inner{fill:#17151f;stroke:#403a4c;stroke-width:1.2}.line{stroke:#f5a04c;stroke-width:3;fill:none;marker-end:url(#arrow)}.icon{font-size:25px}
    </style>
  </defs>
