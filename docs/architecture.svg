  </g>
  <!-- stage headings -->
  <g><circle cx="69" cy="253" r="19" fill="url(#orange)"/><text x="69" y="260" text-anchor="middle" font-size="18" font-weight="800">1</text><text x="98" y="250" class="head">Data discovery</text><text x="98" y="273" class="tiny muted">NVD • Hugging Face • listings</text>
  <circle cx="380" cy="253" r="19" fill="url(#violet)"/><text x="380" y="260" text-anchor="middle" font-size="18" font-weight="800">2</text><text x="409" y="250" class="head">Project scoping</text><text x="409" y="273" class="tiny muted">Templates • goals • metrics</text>
  <circle cx="691" cy="253" r="19" fill="url(#orange)"/><text x="691" y="260" text-anchor="middle" font-size="18" font-weight="800">3</text><text x="720" y="250" class="head">Prepare &amp; train</text><text x="720" y="273" class="tiny muted">Snowpark • task-specific ML</text>
  <circle cx="1002" cy="253" r="19" fill="url(#violet)"/><text x="1002" y="260" text-anchor="middle" font-size="18" font-weight="800">4</text><text x="1031" y="250" class="head">Evaluate &amp; review</text><text x="1031" y="273" class="tiny muted">Held-out metrics • audit ledger</text>
  <circle cx="1313" cy="253" r="19" fill="url(#orange)"/><text x="1313" y="260" text-anchor="middle" font-size="18" font-weight="800">5</text><text x="1342" y="250" class="head">Deploy &amp; share</text><text x="1342" y="273" class="tiny muted">React • Flask • Streamlit</text></g>
  <!-- stage 1 -->
  <rect class="inner" x="56" y="294" width="251" height="86" rx="12"/><text x="75" y="321" class="body" font-weight="700">NIST NVD CVE 2.0</text><text x="75" y="345" class="small muted">Public vulnerability records;</text><text x="75" y="366" class="small muted">CVSS remains NVD sourced.</text>
