  <path d="M654 755v-51h25m-25 51v42h25" fill="none" stroke="#f5a04c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="66" y="885" class="tiny muted">Snowflake AI: Cortex trial-gated; local fallback • CoCo not invoked in this environment.</text>
