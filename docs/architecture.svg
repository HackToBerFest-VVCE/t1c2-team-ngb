  <!-- stage 2 -->
  <rect x="367" y="294" width="251" height="103" rx="12" fill="#24202f" stroke="#e18b45"/><text x="386" y="322" class="tag" fill="#ffb66a">CORE TEMPLATE</text><text x="386" y="350" class="body">Vulnerability prioritization</text><text x="386" y="376" class="small muted">Snowflake source • scoped goals.</text>
  <rect x="367" y="410" width="251" height="103" rx="12" fill="#272035" stroke="#8067c5"/><text x="386" y="438" class="tag" fill="#c6b6ff">PROJECT TEMPLATES</text><text x="386" y="466" class="body">Code flaw • intrusion detection</text><text x="386" y="492" class="small muted">Templates • datasets not linked.</text>
  <text x="492" y="536" text-anchor="middle" class="tiny muted">Goals and success metrics are validated.</text>
  <!-- stage 3 -->
  <rect class="inner" x="678" y="294" width="251" height="63" rx="12"/><text x="697" y="321" class="body" font-weight="700">Snowpark normalization</text><text x="697" y="344" class="small muted">CVE fields cleaned in Snowflake.</text>
  <rect class="inner" x="678" y="370" width="251" height="63" rx="12"/><text x="697" y="397" class="body" font-weight="700">Separate triage heuristic</text><text x="697" y="420" class="small muted">80% source CVSS + 20% recency.</text>
  <rect class="inner" x="678" y="446" width="251" height="86" rx="12"/><text x="697" y="473" class="body" font-weight="700">Python analytics &amp; ML</text><text x="697" y="497" class="small muted">Trends • clusters • anomalies</text><text x="697" y="518" class="small muted">Separate task-specific training.</text>
  <!-- stage 4 -->
  <rect class="inner" x="989" y="294" width="251" height="63" rx="12"/><text x="1008" y="321" class="body" font-weight="700">Source CVSS &amp; severity</text><text x="1008" y="344" class="small muted">Missing CVSS stays unscored.</text>
  <rect class="inner" x="989" y="370" width="251" height="63" rx="12"/><text x="1008" y="397" class="body" font-weight="700">Held-out model evaluation</text><text x="1008" y="420" class="small muted">Held-out dataset metrics only.</text>
  <rect class="inner" x="989" y="446" width="251" height="86" rx="12"/><text x="1008" y="473" class="body" font-weight="700">AI &amp; audit controls</text><text x="1008" y="497" class="small muted">Cortex and audit writes gated</text><text x="1008" y="518" class="small muted">by account plan and role grants.</text>
  <!-- stage 5 -->
  <rect class="inner" x="1300" y="294" width="244" height="63" rx="12"/><text x="1319" y="321" class="body" font-weight="700">React + Flask on Vercel</text><text x="1319" y="344" class="small muted">Production web app is live.</text>
  <rect class="inner" x="1300" y="370" width="244" height="63" rx="12"/><text x="1319" y="397" class="body" font-weight="700">Native Streamlit source</text><text x="1319" y="420" class="small muted">Deploy needs Snowflake grants.</text>
