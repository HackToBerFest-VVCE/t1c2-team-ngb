  <text x="800" y="57" text-anchor="middle" class="tag" fill="#ffab58">TEAM NGB × TEAM NOVA ECOSYSTEM  •  SYSTEM ARCHITECTURE  •  HALLOWEEN EDITION</text>
  <text x="800" y="111" text-anchor="middle" font-size="43" font-weight="850" fill="#f8f2e9">THREATLENS AI</text>
  <text x="800" y="143" text-anchor="middle" class="body muted">Hackathon Challenge 02 • Snowflake-centered, evidence-linked vulnerability intelligence</text>
  <rect x="546" y="160" width="508" height="31" rx="15" fill="#35251f" stroke="#a95c2d"/>
  <text x="800" y="181" text-anchor="middle" class="tag" fill="#ffb76d">LIVE SNOWFLAKE CORE  •  NVD CVEs  •  READ-ONLY APP ROLE</text>

